<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OData Generator for Power Automate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen flex-col">

<div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
    <nav class="mb-4 text-center">
        <span class="text-gray-700 font-semibold">Trigger Generator</span> |
        <a href="dynamics.html" class="text-blue-600 hover:underline">Dataverse Filter Generator</a>
    </nav>
    <h2 class="text-xl font-semibold text-gray-700 mb-4 text-center">Trigger Generator</h2>

    <div id="conditionsContainer">
        <div class="condition-group">
            <label class="block text-gray-600 font-medium mb-1">Column Type:</label>
            <select class="columnType w-full p-2 border rounded-md mb-4" onchange="updateFunctions(this)">
                <option value="default" selected>Choose a column type</option>
                <option value="string">String</option>
                <option value="number">Number</option>
                <option value="boolean">Boolean</option>
                <option value="choice">Choice</option>
            </select>

            <label class="block text-gray-600 font-medium mb-1">Column Name:</label>
            <input type="text" class="columnName w-full p-2 border rounded-md mb-4" placeholder="Enter column name">

            <label class="block text-gray-600 font-medium mb-1">Function:</label>
            <select class="function w-full p-2 border rounded-md mb-4"></select>

            <label class="block text-gray-600 font-medium mb-1">Column Value:</label>
            <input type="text" class="columnValue w-full p-2 border rounded-md mb-4" placeholder="Enter column value">
        </div>
    </div>

    <div id="conditionLogicContainer" class="hidden">
        <label class="block text-gray-600 font-medium mb-1">Condition Logic:</label>
        <select id="conditionLogic" class="w-full p-2 border rounded-md mb-4">
            <option value="or">OR</option>
            <option value="and">AND</option>
        </select>
    </div>

    <button onclick="addCondition()" class="w-full bg-gray-600 text-white font-medium py-2 rounded-md hover:bg-gray-700 transition mb-3 flex items-center justify-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Add Another Condition</span>
    </button>

    <button onclick="generateTrigger()" class="w-full bg-blue-600 text-white font-medium py-2 rounded-md hover:bg-blue-700 transition flex items-center justify-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
        </svg>
        <span>Generate Condition</span>
    </button>

    <div id="generatedSection" class="mt-4 hidden">
        <h3 class="text-sm text-gray-600 font-medium">Generated OData Condition:</h3>
        <div id="output" class="mt-2 p-3 bg-gray-200 text-gray-700 rounded-md text-sm"></div>
        <button onclick="copyToClipboard()" class="w-full bg-green-600 text-white font-medium py-2 rounded-md hover:bg-green-700 transition mt-2 flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 
                1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 
                1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
            </svg>
            <span>Copy to Clipboard</span>
        </button>
    </div>
</div>

<div class="mt-8 text-center text-sm text-gray-600">
    <p>Made by <a href="https://github.com/Jack-JB" target="_blank" class="text-blue-600 hover:underline">Jack Burrows</a></p>
</div>

<script>
    function addCondition() {
        const conditionsContainer = document.getElementById('conditionsContainer');
        const conditionGroup = document.createElement('div');
        conditionGroup.classList.add("relative", "bg-gray-100", "border", "border-gray-300", "rounded-lg", "p-4", "mb-4", "shadow-sm", "condition-group");

        conditionGroup.innerHTML = `
            <button class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded hover:bg-red-600 transition" onclick="removeCondition(this)">✕</button>
            <label class="block text-gray-600 font-medium mb-1">Column Type:</label>
            <select class="columnType w-full p-2 border rounded-md mb-4" onchange="updateFunctions(this)">
                <option value="default" selected>Choose a column type</option>
                <option value="string">String</option>
                <option value="number">Number</option>
                <option value="boolean">Boolean</option>
                <option value="choice">Choice</option>
            </select>
            <label class="block text-gray-600 font-medium mb-1">Column Name:</label>
            <input type="text" class="columnName w-full p-2 border rounded-md mb-4" placeholder="Enter column name">
            <label class="block text-gray-600 font-medium mb-1">Function:</label>
            <select class="function w-full p-2 border rounded-md mb-4">
                <option value="default">Choose a function</option>
            </select>
            <label class="block text-gray-600 font-medium mb-1">Column Value:</label>
            <input type="text" class="columnValue w-full p-2 border rounded-md mb-4" placeholder="Enter column value">
        `;

        conditionsContainer.appendChild(conditionGroup);
        updateFunctions(conditionGroup.querySelector('.columnType'));
        document.getElementById("conditionLogicContainer").classList.remove("hidden");
    }

    function removeCondition(button) {
        button.parentElement.remove();
    }

    function updateFunctions(columnTypeSelect) {
        const conditionGroup = columnTypeSelect.closest('.condition-group');
        const functionSelect = conditionGroup.querySelector('.function');
        functionSelect.innerHTML = '';

        const columnType = columnTypeSelect.value;
        const functions = {
            string: ['equals', 'notEquals', 'contains', 'empty', 'notEmpty', 'startsWith', 'endsWith'],
            number: ['equals', 'notEquals', 'greater', 'less', 'greaterOrEquals', 'lessOrEquals'],
            boolean: ['equals', 'notEquals'],
            choice: ['equals', 'notEquals', 'empty', 'notEmpty']
        };

        if (columnType === 'default') {
            functionSelect.innerHTML = '<option value="default">Choose a function</option>';
            return;
        }

        (functions[columnType] || []).forEach(func => {
            const option = document.createElement('option');
            option.value = func;
            option.textContent = func.charAt(0).toUpperCase() + func.slice(1).replace(/([A-Z])/g, ' $1');
            functionSelect.appendChild(option);
        });
    }

    function copyToClipboard() {
        const outputText = document.getElementById('output').innerText;
        const textarea = document.createElement('textarea');
        textarea.value = outputText;
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, 99999);
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('OData condition copied to clipboard!');
    }

    function generateTrigger() {
        const columnTypes = document.querySelectorAll('.columnType');
        const columnNames = document.querySelectorAll('.columnName');
        const functions = document.querySelectorAll('.function');
        const columnValues = document.querySelectorAll('.columnValue');
        const conditionLogic = document.getElementById('conditionLogic').value;

        const functionMap = {
            equals: "equals",
            notEquals: "not",
            greater: "greater",
            less: "less",
            greaterOrEquals: "greaterOrEquals",
            lessOrEquals: "lessOrEquals"
        };

        let conditions = [];

        for (let i = 0; i < columnNames.length; i++) {
            const columnType = columnTypes[i].value;
            const columnName = columnNames[i].value.trim();
            const func = functions[i].value;
            const columnValue = columnValues[i].value.trim();

            if (!columnName || !columnValue) continue;

            let condition = "";

            if (columnType === "choice") {
                condition = `${functionMap[func]}(triggerBody()?['${columnName}']?['Value'], '${columnValue}')`;
            } else if (columnType === "string") {
                condition = `${functionMap[func]}(triggerBody()?['${columnName}'], '${columnValue}')`;
            } else {
                condition = `${functionMap[func]}(triggerBody()?['${columnName}'], ${columnValue})`;
            }

            conditions.push(condition);
        }

        let triggerCondition = conditions.length > 1
            ? `@${conditionLogic}(${conditions.join(", ")})`
            : `@${conditions[0] || "No valid conditions entered."}`;

        document.getElementById('generatedSection').classList.remove('hidden');
        document.getElementById('output').innerText = triggerCondition;
    }
</script>

</body>
</html>

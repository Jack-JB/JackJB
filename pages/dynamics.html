<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataverse Filter Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen flex-col">

    <!-- Main Content -->
    <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
        <nav class="mb-4 text-center">
            <a href="odata.html" class="text-blue-600 hover:underline">Trigger Generator</a> |
            <span class="text-gray-700 font-semibold">Dataverse Filter Generator</span>
        </nav>

        <h2 class="text-xl font-semibold text-gray-700 mb-4 text-center">Dataverse OData Filter</h2>

        <div id="conditionsContainer">
            <div class="condition-group">
                <label class="block text-gray-600 font-medium mb-1">Column Name:</label>
                <input type="text" class="columnName w-full p-2 border rounded-md mb-4" placeholder="Enter column name">

                <label class="block text-gray-600 font-medium mb-1">Operator:</label>
                <select class="operator w-full p-2 border rounded-md mb-4">
                    <option value="eq">Equals (eq)</option>
                    <option value="ne">Not Equals (ne)</option>
                    <option value="gt">Greater Than (gt)</option>
                    <option value="lt">Less Than (lt)</option>
                    <option value="ge">Greater or Equal (ge)</option>
                    <option value="le">Less or Equal (le)</option>
                </select>

                <label class="block text-gray-600 font-medium mb-1">Value:</label>
                <input type="text" class="value w-full p-2 border rounded-md mb-4" placeholder="Enter value">
            </div>
        </div>

        <div id="conditionLogicContainer" class="hidden">
            <label class="block text-gray-600 font-medium mb-1">Condition Logic:</label>
            <select id="conditionLogic" class="w-full p-2 border rounded-md mb-4">
                <option value="and">AND</option>
                <option value="or">OR</option>
            </select>
        </div>

        <button onclick="addCondition()" class="w-full bg-gray-600 text-white font-medium py-2 rounded-md hover:bg-gray-700 transition mb-3 flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span>Add Another Condition</span>
        </button>

        <button onclick="generateFilter()" class="w-full bg-blue-600 text-white font-medium py-2 rounded-md hover:bg-blue-700 transition flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
            </svg>
            <span>Generate Filter</span>
        </button>

        <div id="generatedSection" class="mt-4 hidden">
            <h3 class="text-sm text-gray-600 font-medium">Generated OData Condition:</h3>
            <div id="output" class="mt-2 p-3 bg-gray-200 text-gray-700 rounded-md text-sm"></div>
            <button onclick="copyToClipboard()" class="w-full bg-green-600 text-white font-medium py-2 rounded-md hover:bg-green-700 transition mt-2 flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                </svg>
                <span>Copy to Clipboard</span>
            </button>
        </div>
    </div>

    <div class="mt-8 text-center text-sm text-gray-600">
        <p>Made by <a href="https://github.com/Jack-JB" target="_blank" class="text-blue-600 hover:underline">Jack Burrows</a></p>
    </div>

    <script>
        function addCondition() {
            const container = document.getElementById('conditionsContainer');
            const group = document.createElement('div');
            group.classList.add("relative", "bg-gray-100", "border", "border-gray-300", "rounded-lg", "p-4", "mb-4", "shadow-sm", "condition-group");
            group.innerHTML = `
                <button class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded hover:bg-red-600 transition" onclick="removeCondition(this)">✕</button>
                <label class="block text-gray-600 font-medium mb-1">Column Name:</label>
                <input type="text" class="columnName w-full p-2 border rounded-md mb-4" placeholder="Enter column name">
                <label class="block text-gray-600 font-medium mb-1">Operator:</label>
                <select class="operator w-full p-2 border rounded-md mb-4">
                    <option value="eq">Equals (eq)</option>
                    <option value="ne">Not Equals (ne)</option>
                    <option value="gt">Greater Than (gt)</option>
                    <option value="lt">Less Than (lt)</option>
                    <option value="ge">Greater or Equal (ge)</option>
                    <option value="le">Less or Equal (le)</option>
                </select>
                <label class="block text-gray-600 font-medium mb-1">Value:</label>
                <input type="text" class="value w-full p-2 border rounded-md mb-4" placeholder="Enter value">
            `;
            container.appendChild(group);
            document.getElementById("conditionLogicContainer").classList.remove("hidden");
        }

        function removeCondition(btn) {
            btn.parentElement.remove();
        }

        function generateFilter() {
            const names = document.querySelectorAll('.columnName');
            const ops = document.querySelectorAll('.operator');
            const values = document.querySelectorAll('.value');
            const logic = document.getElementById('conditionLogic').value;

            const filters = [];
            for (let i = 0; i < names.length; i++) {
                const name = names[i].value.trim();
                const op = ops[i].value;
                const val = values[i].value.trim();
                if (!name || !val) continue;
                filters.push(`${name} ${op} ${isNaN(val) ? `'${val}'` : val}`);
            }

            const result = filters.length > 1 ? filters.join(` ${logic} `) : filters[0] || "No valid filters.";
            document.getElementById('generatedSection').classList.remove('hidden');
            document.getElementById('output').innerText = result;
        }

        function copyToClipboard() {
            const output = document.getElementById('output').innerText;
            const textarea = document.createElement('textarea');
            textarea.value = output;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Filter copied to clipboard!');
        }
    </script>

</body>
</html>

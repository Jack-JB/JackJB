<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Minifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Include Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen flex-col">

<div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
  <h1 class="text-xl font-semibold text-gray-700 mb-4 text-center">JSON Minifier</h1>

  <label class="block text-gray-600 font-medium mb-1">JSON Input:</label>
  <textarea id="jsonInput" oninput="updateInputCount()" class="w-full p-2 border rounded-md mb-2 h-40 font-mono"></textarea>
  <div class="text-gray-500 text-sm mb-4">Input character count: <span id="inputCount">0</span></div>

  <button onclick="minifyJson()" class="w-full bg-blue-600 text-white font-medium py-2 rounded-md hover:bg-blue-700 transition flex items-center justify-center space-x-2">
    <i class="fas fa-compress"></i>
    <span>Minify JSON</span>
  </button>

  <!-- Output Section -->
  <div id="outputSection" class="hidden">
    <h2 class="text-gray-700 font-semibold mb-2">Output</h2>
    <div id="output" class="bg-gray-200 p-3 rounded-md text-sm font-mono mb-1 break-words overflow-auto max-h-40"></div>
    <div class="text-gray-500 text-sm mb-4">Output character count: <span id="outputCount">0</span></div>
    <button onclick="copyToClipboard('output')" class="w-full bg-gray-600 text-white font-medium py-2 rounded-md hover:bg-gray-700 transition flex items-center justify-center space-x-2">
      <i class="fas fa-copy"></i>
      <span>Copy Output</span>
    </button>
  </div>
</div>

<script>
  function minifyJson() {
    const input = document.getElementById('jsonInput').value.trim();
    const outputEl = document.getElementById('output');
    const outputCountEl = document.getElementById('outputCount');
    const outputSection = document.getElementById('outputSection');
    const inputCount = input.length;

    try {
      const parsed = JSON.parse(input);
      const result = JSON.stringify(parsed);
      outputEl.textContent = result;
      outputEl.classList.remove('bg-red-200', 'text-red-700'); // Remove error styles
      outputEl.classList.add('bg-gray-200', 'text-gray-700'); // Add normal styles
      outputCountEl.textContent = `${result.length} (${calculateReductionPercentage(inputCount, result.length)}% reduction)`;

      // Show the output section
      outputSection.classList.remove('hidden');
    } catch (err) {
      outputEl.textContent = 'Invalid JSON: ' + err.message;
      outputEl.classList.remove('bg-gray-200', 'text-gray-700'); // Remove normal styles
      outputEl.classList.add('bg-red-200', 'text-red-700'); // Add error styles
      outputCountEl.textContent = '0 (0% reduction)';

      // Show the output section even for errors
      outputSection.classList.remove('hidden');
    }
  }

  function updateInputCount() {
    const input = document.getElementById('jsonInput').value;
    document.getElementById('inputCount').textContent = input.length;
  }

  function calculateReductionPercentage(inputCount, outputCount) {
    if (inputCount === 0) return 0; // Avoid division by zero
    const reduction = ((inputCount - outputCount) / inputCount) * 100;
    return reduction.toFixed(2); // Round to 2 decimal places
  }

  function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).textContent;
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    alert('Copied to clipboard!');
  }
</script>

</body>
</html>
